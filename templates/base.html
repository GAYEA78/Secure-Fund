{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Fund{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <script defer src="{% static 'js/script.js' %}"></script>
</head>
<body class="background-image d-flex flex-column min-vh-100">

  <div class="dashboard-header-wrapper position-relative text-center">
    <img src="{% static 'images/logo.jpeg' %}" alt="Secure Fund logo" class="bank-logo-absolute">
    <div class="masthead-eyebrow">Arona Edge Fintech</div>
    <div class="dashboard-header">Secure Fund</div>
    <div class="dashboard-subheader">Where finance meets top-tier technology</div>
  </div>

  <div class="container-fluid px-0 flex-grow-1">
    {% block content %}{% endblock %}
  </div>

  <footer class="mt-auto">
    © 2025 Arona Gaye · Secure Fund · Built with Django
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
